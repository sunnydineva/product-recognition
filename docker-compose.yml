name: ai-service

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product_recognition}
      POSTGRES_USER: ${POSTGRES_USER:-product_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      AI_DB_USER: ${AI_DB_USER:-}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-}
      INVENTORY_DB: ${INVENTORY_DB:-inventory}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-inventory_service}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database:/opt/database:ro
      - ./infrastructure/database/init-fresh.sh:/docker-entrypoint-initdb.d/10-services.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-product_user} -d ${POSTGRES_DB:-product_recognition}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: redgate/flyway:11
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-product_recognition}
      FLYWAY_USER: ${AI_DB_USER:-${POSTGRES_USER:-product_user}}
      FLYWAY_PASSWORD: ${AI_DB_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - ./ai-service/database/migrations:/flyway/sql:ro
    command: migrate
    restart: "no"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ai-product-recognition-cloudflared
    restart: unless-stopped
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./ai-service/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS_FILE}:/etc/cloudflared/credentials.json:ro

  # NOTE: Kafka, Zookeeper, and Schema Registry are temporarily reused from
  # the online-shop docker-compose (shared-net external network).
  # See /home/sunny/ss/projects/test/online-shop/docker-compose.yml
  inventory-service:
    build:
      context: ./backend/inventory-service
      dockerfile: Dockerfile
    container_name: ai-product-recognition-inventory
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      INVENTORY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${INVENTORY_DB:-inventory}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-inventory_service}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - default
      - shared-net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  shared-net:
    external: true

volumes:
  postgres_data:

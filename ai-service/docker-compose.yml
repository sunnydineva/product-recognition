services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product_recognition}
      POSTGRES_USER: ${POSTGRES_USER:-product_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-product_user} -d ${POSTGRES_DB:-product_recognition}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: redgate/flyway:11
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/migrations:/flyway/sql:ro
    command: migrate
    restart: "no"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ai-product-recognition-cloudflared
    restart: unless-stopped
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS_FILE}:/etc/cloudflared/credentials.json:ro

  # NOTE: Kafka, Zookeeper, and Schema Registry are temporarily reused from
  # the online-shop docker-compose (shared-net external network).
  # See /home/sunny/ss/projects/test/online-shop/docker-compose.yml
  inventory-service:
    build:
      context: ../backend/inventory-service
      dockerfile: Dockerfile
    container_name: ai-product-recognition-inventory
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - shared-net

networks:
  shared-net:
    external: true

volumes:
  postgres_data:
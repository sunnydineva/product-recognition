<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    >
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Product Enrollment</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 16px;
        }

        video {
            width: 100%;
            max-height: 56vh;
            height: auto;
            margin: 0 auto;
            display: block;
            background: black;
            border-radius: 12px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>
<h2>Добавяне на продукт</h2>

<label for="sku">Баркод / SKU</label>
<input
        id="sku"
        type="text"
        placeholder="Сканирай или въведи баркод"
        autocomplete="off"
>

<label for="initialQuantity">Начално количество (по избор)</label>
<input id="initialQuantity" type="number" min="0" max="2147483647" step="1" value="0">
<p>Само за нов продукт в inventory. При съществуващ SKU наличността не се променя;
    използвайте ръчната корекция. Количеството не зависи от броя снимки.</p>

<label for="name">Име (по избор)</label>
<input
        id="name"
        type="text"
        maxlength="255"
        placeholder="Име за показване"
        autocomplete="off"
>

<label for="note">Бележка (по избор)</label>
<input
        id="note"
        type="text"
        maxlength="2000"
        placeholder="Кратка бележка"
        autocomplete="off"
>

<video
        id="camera"
        autoplay
        muted
        playsinline
></video>

<button id="startCamera">Отвори камерата</button>
<button id="record" disabled>Запиши 12 секунди</button>

<p id="status"></p>

<p id="dbStatus"></p>

<h3>Открити продукти</h3>
<div id="previewImages"></div>

<div id="previewActions" hidden>
    <button id="retryRecording" type="button">
        Повтори записа
    </button>

    <button id="approveImages" type="button">
        Одобри избраните
    </button>

    <p id="approvalStatus"></p>
</div>

<script src="/enroll.js?v=9"></script>
</body>
</html>

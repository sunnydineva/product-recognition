<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    >
    <title>AI Product Recognition - Live Camera</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 16px;
        }

        video {
            width: 100%;
            max-height: 70vh;
            height: auto;
            background: black;
            border-radius: 12px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        #status {
            margin-top: 16px;
        }

        .camera-container {
            position: relative;
            width: 100%;
            margin: 0 auto;
        }

        .camera-container video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 70vh;
        }

        .camera-container canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>

<body>
<h2>AI Product Recognition</h2>


<div class="camera-container">
    <video
            id="camera"
            autoplay
            muted
            playsinline
    ></video>

    <canvas id="overlay"></canvas>
</div>

<button id="startCamera" type="button">
    Start Camera
</button>

<button id="stopCamera" type="button" disabled>
    Stop Camera
</button>

<p id="status">Камерата е спряна.</p>

<script src="/camera.js?v=10"></script>
</body>
</html>

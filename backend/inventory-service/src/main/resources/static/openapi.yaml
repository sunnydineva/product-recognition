openapi: 3.0.3
info:
  title: Inventory Service API
  version: 1.0.0
  description: Inventory REST API under /api/v1
paths:
  /api/v1/products:
    get:
      summary: List products
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
        - in: query
          name: sort
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: active
          schema: { type: boolean }
        - in: query
          name: hasActiveAlert
          schema: { type: boolean }
      responses:
        '200':
          description: Paged products
    post:
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Created
  /api/v1/products/{id}:
    get:
      summary: Get product
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
    patch:
      summary: Update product
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Updated
  /api/v1/products/{id}/stock-adjustments:
    post:
      summary: Adjust stock
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
      responses:
        '200':
          description: Movement
  /api/v1/products/{id}/stock-movements:
    get:
      summary: List stock movements
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Paged movements
  /api/v1/products/{id}/stock-policy:
    put:
      summary: Update stock policy
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockPolicyRequest'
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPolicyResponse'
  /api/v1/settings:
    get:
      summary: Get global settings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettingsResponse'
    put:
      summary: Update global settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalSettingsRequest'
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettingsResponse'
  /api/v1/alerts:
    get:
      summary: List alerts
      responses:
        '200':
          description: Paged alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertResponse'
  /api/v1/alerts/{id}/acknowledgement:
    post:
      summary: Acknowledge alert
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeAlertRequest'
      responses:
        '200':
          description: Alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
components:
  schemas:
    ProductCreateRequest:
      type: object
      required: [name, sku]
      properties:
        name: { type: string }
        sku: { type: string }
        barcode: { type: string }
        initialQuantity: { type: integer, format: int64, default: 0 }
        active: { type: boolean, default: true }
    ProductUpdateRequest:
      type: object
      properties:
        name: { type: string }
        barcode: { type: string }
        note: { type: string, nullable: true, description: Canonical inventory note; blank clears it. }
        active: { type: boolean }
    StockAdjustmentRequest:
      type: object
      required: [operation, quantity, source]
      properties:
        operation: { type: string, enum: [INCREASE, DECREASE] }
        quantity: { type: integer, format: int64, minimum: 1 }
        source: { type: string }
        note: { type: string }
    StockPolicyRequest:
      type: object
      properties:
        lowStockThreshold: { type: integer, format: int64, minimum: 0, nullable: true }
        alertEnabled: { type: boolean, nullable: true }
        reorderQuantity: { type: integer, format: int64, minimum: 0, nullable: true }
        rapidDrop:
          allOf:
            - $ref: '#/components/schemas/RapidDropPolicy'
          description: Omitted or null object preserves rapid overrides. Present object replaces them; null or omitted members inherit global settings. Empty object resets all rapid overrides.
    GlobalSettingsRequest:
      type: object
      required: [defaultLowStockThreshold, defaultAlertEnabled]
      properties:
        defaultLowStockThreshold: { type: integer, format: int64, minimum: 0 }
        defaultAlertEnabled: { type: boolean }
        defaultReorderQuantity: { type: integer, format: int64, minimum: 0, nullable: true }
        rapidDrop:
          allOf:
            - $ref: '#/components/schemas/RapidDropPolicy'
          description: Omitted or null object/members retain existing global values. Defaults are enabled=true, percent=50, windowHours=24, minimumDrop=1.
    RapidDropPolicy:
      type: object
      nullable: true
      properties:
        enabled: { type: boolean, nullable: true }
        percent: { type: integer, minimum: 1, maximum: 100, nullable: true }
        windowHours: { type: integer, minimum: 1, maximum: 8760, nullable: true }
        minimumDrop: { type: integer, format: int64, minimum: 1, nullable: true }
    GlobalSettingsResponse:
      allOf:
        - $ref: '#/components/schemas/GlobalSettingsRequest'
        - type: object
          properties:
            updatedAt: { type: string, format: date-time }
    StockPolicyResponse:
      allOf:
        - $ref: '#/components/schemas/StockPolicyRequest'
        - type: object
          properties:
            productId: { type: integer, format: int64 }
            updatedAt: { type: string, format: date-time }
    ProductResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sku: { type: string }
        name: { type: string }
        barcode: { type: string, nullable: true }
        note: { type: string, nullable: true, description: Canonical inventory note; AI events only seed it when the product is created. }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        stock:
          type: object
          properties:
            quantity: { type: integer, format: int64 }
            updatedAt: { type: string, format: date-time }
        effectiveSettings:
          type: object
          properties:
            lowStockThreshold: { type: integer, format: int64 }
            alertEnabled: { type: boolean }
            reorderQuantity: { type: integer, format: int64, nullable: true }
            source: { type: string, enum: [GLOBAL, PRODUCT] }
            rapidDrop:
              $ref: '#/components/schemas/RapidDropPolicy'
    AlertResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        productSku: { type: string, nullable: true }
        type: { type: string, enum: [LOW_STOCK, RAPID_DROP] }
        status: { type: string, enum: [ACTIVE, ACKNOWLEDGED, RESOLVED] }
        threshold:
          type: integer
          format: int64
          nullable: true
          description: LOW_STOCK threshold only; null for RAPID_DROP.
        quantity: { type: integer, format: int64 }
        triggeredAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        acknowledgedBy: { type: string, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
        rapidDrop:
          type: object
          nullable: true
          description: Last qualifying measurement; retained on resolution. Null for LOW_STOCK.
          properties:
            baseline: { type: integer, format: int64 }
            current: { type: integer, format: int64 }
            percent: { type: integer }
            windowHours: { type: integer }
            minimumDrop: { type: integer, format: int64 }
            measuredPercent: { type: number, description: Rounded to six decimals; qualification uses exact arithmetic. }
    AcknowledgeAlertRequest:
      type: object
      required: [acknowledgedBy]
      properties:
        acknowledgedBy: { type: string }
        note: { type: string }
